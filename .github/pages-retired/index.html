<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>D5 WebTool</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f5f2; --text: #16181d; --muted: #5d6270; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1115; --text: #eceef2; --muted: #a2a7b3; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; box-sizing: border-box;
    background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  .mark { display: inline-flex; gap: 3px; padding: 6px; border-radius: 8px; background: var(--text); }
  .mark i { width: 5px; height: 16px; border-radius: 2px; background: #ff5a36; }
  .mark i:nth-child(2) { background: #ffc53d; } .mark i:nth-child(3) { background: #2bb8a6; }
  h1 { font-size: 1.3rem; margin: 14px 0 6px; } p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
  <main>
    <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
    <h1>D5 WebTool</h1>
    <p>This copy of the tool is no longer available.</p>
  </main>
</body>
</html>
