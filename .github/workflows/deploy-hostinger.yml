name: Deploy to Hostinger

# Uploads the built app and the PHP API to Hostinger over FTP on every push to main.
# Does nothing until these repository secrets exist (Settings → Secrets and variables → Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_DIR   (optional: FTP_PROTOCOL = ftps | ftp)
# api/config.php (written once by api/setup.php on the server) is never uploaded or deleted.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' }}
    steps:
      - name: Hostinger not configured yet
        if: env.HAS_FTP != 'true'
        run: echo "Skipping Hostinger deploy. Add the FTP_* secrets to enable it (see docs/HOSTINGER.md)."

      - uses: actions/checkout@v4
        if: env.HAS_FTP == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_FTP == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Build and test
        if: env.HAS_FTP == 'true'
        run: |
          npm ci
          npm test
          npm run build
          for f in server/api/*.php server/api/src/*.php; do php -l "$f"; done

      - name: Assemble site (app + api)
        if: env.HAS_FTP == 'true'
        run: |
          mkdir -p deploy/api
          cp -r dist/. deploy/
          cp -r server/api/. deploy/api/
          rm -f deploy/api/config.php

      - name: Upload to Hostinger
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./deploy/
          exclude: |
            **/config.php
            **/.git*
            **/.git*/**
