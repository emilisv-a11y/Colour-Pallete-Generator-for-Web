name: Retire GitHub Pages copy

# The app now lives on the owner's own domain (Hostinger, behind a sign-in).
# This replaces the old public GitHub Pages copy with a short "no longer available" page.
on:
  push:
    branches: [main]
    paths:
      - .github/pages-retired/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .github/pages-retired

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
